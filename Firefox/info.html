<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>راهنمای Flow Shield</title>
  <style>
    body {
      background: #0b0f19;
      color: #f8fafc;
      font-family: system-ui, Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #141b2d;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 30px;
      max-width: 420px;
      text-align: right;
    }
    h1 { font-size: 20px; margin-top: 0; color: #a5b4fc; }
    p { font-size: 13px; line-height: 1.8; color: #94a3b8; }
    .step { margin: 12px 0; display: flex; gap: 8px; }
    .num { color: #6366f1; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>راهنمای استفاده</h1>
    <div class="step"><span class="num">۱.</span><span>افزونه را از منوی بالای مرورگر باز کرده و سوییچ دسترسی را فعال کنید.</span></div>
    <div class="step"><span class="num">۲.</span><span>وارد سایت flow.google.com شوید؛ در صورت مشاهده صفحه خطا، دکمه رفرش افزونه را بزنید.</span></div>
    <div class="step"><span class="num">۳.</span><span>پس از یک بار لود موفق، وضعیت روی «دسترسی فعال است» قرار می‌گیرد.</span></div>
  </div>
</body>
</html>
